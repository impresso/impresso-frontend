name: Build and publish Docker image for Release

on:
  # Trigger the workflow on version tags and preview tags (and manually from the Actions tab)
  push:
    tags:
      - 'v*'
      - 'preview-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: impresso/impresso-frontend
  APP_HOST: https://impresso-project.ch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history + tags are required by `git describe`
          fetch-depth: 0
          fetch-tags: true

      - name: Extract build metadata
        id: meta
        shell: bash
        run: |
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --abbrev=0 "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          build-args: |
            GIT_TAG=${{ steps.meta.outputs.version }}
            GIT_BRANCH=${{ steps.meta.outputs.branch }}
            GIT_REVISION=${{ steps.meta.outputs.revision }}
            APP_HOST=${{ env.APP_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
