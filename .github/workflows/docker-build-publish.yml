name: Build and publish Docker image

on:
  # Trigger the workflow on push to the develop branch (and manually from the Actions tab)
  push:
    branches:
      - develop
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '**/*.md'
      - '.github/**'
      - '.cursorrules'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: impresso/impresso-frontend
  DOCKER_TAG: latest
  APP_HOST: https://dev.impresso-project.ch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract build metadata
        id: meta
        shell: bash
        run: |
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          build-args: |
            GIT_TAG=${{ env.DOCKER_TAG }}
            GIT_BRANCH=${{ steps.meta.outputs.branch }}
            GIT_REVISION=${{ steps.meta.outputs.revision }}
            APP_HOST=${{ env.APP_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
