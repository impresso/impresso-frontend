name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - 'README.md'
      - '.github/agents/**/*.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npx vitest run
